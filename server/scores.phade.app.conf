# scores.phade.app: Phade Scores' push server (the scores-push container).
# Lives in /var/www/phade/nginx/conf.d/ next to phade.conf. The upstream is
# resolved per request, so phade-nginx (and phade.app) still start and serve
# when scores-push is down.

server {
    listen 80;
    server_name scores.phade.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name scores.phade.app;

    ssl_certificate     /etc/letsencrypt/live/scores.phade.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scores.phade.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 16k;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $scores_push http://scores-push:8080;

    location / {
        proxy_pass $scores_push;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
